name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: npm ci

      - name: Install Web console dependencies
        env:
          CI: 'true'
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Run complete release gate
        env:
          CI: 'true'
        run: npm run verify:release

      - name: Build Windows package
        if: runner.os == 'Windows'
        run: npm run weixin:electron:dist

      - name: Smoke-test packaged Windows application
        if: runner.os == 'Windows'
        run: node scripts/release/smoke_packaged.mjs
