version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - web
    commit-message:
      prefix: deps(web)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
